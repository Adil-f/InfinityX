services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: infinityx
      POSTGRES_PASSWORD: infinityx
      POSTGRES_DB: infinityx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinityx -d infinityx"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    environment:
      APP_ENV: development
      SECRET_KEY: dev-only-change-me-not-for-production
      DATABASE_URL: postgresql+psycopg://infinityx:infinityx@postgres:5432/infinityx
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SEED_DEV_FIXTURES: "true"
      ADMIN_EMAIL: admin@infinityx.local
      ADMIN_PASSWORD: ChangeMe-Local-Only-1
      ADMIN_NAME: Local Admin
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
